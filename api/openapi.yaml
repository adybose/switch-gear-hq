openapi: 3.1.0
info:
  title: Switch Gear Store API
  version: 0.1.0
  description: >
    REST API for the Switch Gear store. Agents call it through the `sg` CLI.
    All money is integer paise. All times are ISO 8601 UTC.
    Over-limit actions return 202 with an approval ID instead of executing.
    Simulator clock/generator controls are specified separately in api/sim.openapi.yaml.
servers:
  - url: http://localhost:3000/api/v1
security:
  - departmentKey: []
tags:
  - { name: public, description: Storefront calls, no key }
  - { name: orders }
  - { name: fulfilment }
  - { name: finance }
  - { name: marketing }
  - { name: support }
  - { name: approvals }
  - { name: platform }
paths:
  /health:
    get:
      tags: [platform]
      security: []
      responses: { '200': { description: OK } }

  # ---------- public ----------
  /catalog/products:
    get:
      tags: [public]
      security: []
      parameters:
        - { name: collection, in: query, schema: { type: string } }
      responses:
        '200': { description: Products, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Product' } } } } }
  /catalog/products/{slug}:
    get:
      tags: [public]
      security: []
      parameters: [ { name: slug, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: Product, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /checkout:
    post:
      tags: [public]
      security: []
      description: >
        Prices every line from the catalogue (client prices are ignored). 422 errors include
        not_serviceable (PIN code ShipFast doesn't serve), discount_code_invalid and unknown_sku,
        with a customer-facing message in details keyed by field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, customer]
              properties:
                items: { type: array, items: { type: object, required: [sku, qty], properties: { sku: { type: string }, qty: { type: integer, minimum: 1, maximum: 10 } } } }
                customer: { $ref: '#/components/schemas/CustomerInput' }
                discountCode: { type: string }
                source: { type: string, enum: [web, generator], default: web }
      responses:
        '201':
          description: >
            Order placed. paymentUrl (/pay/ORD-…?t=…) redirects to the PayMock page for the order;
            an order not paid within 30 business minutes (and at least 5 real minutes) is cancelled.
          content: { application/json: { schema: { type: object, properties: { orderNumber: { type: string }, totalPaise: { type: integer }, paymentUrl: { type: string } } } } }
        '422': { $ref: '#/components/responses/Invalid' }
  /checkout/quote:
    post:
      tags: [public]
      security: []
      description: >
        Totals for a cart before the order is placed, priced from the catalogue. An invalid
        discount code or unserviceable PIN code is reported in the body, not as an error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items: { type: array, items: { type: object, required: [sku, qty], properties: { sku: { type: string }, qty: { type: integer, minimum: 1, maximum: 10 } } } }
                discountCode: { type: string }
                state: { type: string, description: 'Delivery state, for CGST+SGST vs IGST; default Karnataka' }
                pincode: { type: string }
      responses:
        '200':
          description: Quote
          content:
            application/json:
              schema:
                type: object
                properties:
                  itemCount: { type: integer }
                  subtotalPaise: { type: integer }
                  discountSource: { type: [string, 'null'], enum: [bundle, code, null] }
                  discountPercent: { type: integer }
                  discountPaise: { type: integer }
                  shippingPaise: { type: integer }
                  taxPaise: { type: integer }
                  totalPaise: { type: integer }
                  discountCode: { type: [string, 'null'] }
                  discountCodeError: { type: [string, 'null'] }
                  pincode:
                    type: [object, 'null']
                    properties:
                      serviceable: { type: boolean }
                      zone: { type: string, enum: [same_city, same_zone, national] }
                      transitDays: { type: integer }
                      reason: { type: string, enum: [invalid_pincode, not_serviceable] }
                      message: { type: string }
        '422': { $ref: '#/components/responses/Invalid' }
  /orders/track:
    get:
      tags: [public]
      security: []
      parameters:
        - { name: number, in: query, required: true, schema: { type: string } }
        - { name: email, in: query, required: true, schema: { type: string, format: email } }
      responses:
        '200': { description: Order status timeline, content: { application/json: { schema: { $ref: '#/components/schemas/TrackedOrder' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /tickets:
    post:
      tags: [public]
      security: []
      summary: Contact form or return request from the website
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email, type, message], properties: { email: { type: string }, orderNumber: { type: string }, type: { type: string, enum: [wismo, exchange, return, complaint, other] }, message: { type: string, maxLength: 2000 } } }
      responses:
        '201': { description: Ticket created, content: { application/json: { schema: { type: object, required: [ticketNumber], properties: { ticketNumber: { type: string, example: TCK-1 } } } } } }
        '422': { $ref: '#/components/responses/Invalid' }
    get:
      tags: [support]
      parameters: [ { name: status, in: query, schema: { type: string, enum: [open, waiting, closed] } } ]
      responses: { '200': { description: Tickets, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Ticket' } } } } } }

  # ---------- orders ----------
  /orders:
    get:
      tags: [orders]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses: { '200': { description: Orders, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Order' } } } } } }
  /orders/{number}:
    get:
      tags: [orders]
      parameters: [ { $ref: '#/components/parameters/OrderNumber' } ]
      responses:
        '200': { description: Order, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders/{number}/cancel:
    post:
      tags: [fulfilment, support]
      summary: Cancel before printing starts; triggers a full refund
      parameters: [ { $ref: '#/components/parameters/OrderNumber' } ]
      responses:
        '200': { description: Cancelled }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------- fulfilment ----------
  /print-jobs:
    get:
      tags: [fulfilment]
      description: 'Requires print_jobs:read (fulfilment, hq, founder). Latest 200 jobs, newest first.'
      parameters: [ { name: status, in: query, schema: { $ref: '#/components/schemas/PrintJobStatus' } } ]
      responses:
        '200': { description: Print jobs with orderNumber, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PrintJob' } } } } }
        '401': { description: Missing or invalid API key }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
    post:
      tags: [fulfilment]
      description: 'Requires print_jobs:write (fulfilment). Only a paid order without a job can be submitted. On partner acceptance, order becomes printing. Parallel or repeated submissions return 409.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [orderNumber]
              properties:
                orderNumber: { type: string, pattern: '^ORD-[0-9]{1,12}$' }
      responses:
        '201': { description: Sent to PrintHub, content: { application/json: { schema: { $ref: '#/components/schemas/PrintJob' } } } }
        '401': { description: Missing or invalid API key }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
        '503': { description: PrintHub unavailable or unexpected partner response; safe to retry, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /print-jobs/{id}/reprint:
    post:
      tags: [fulfilment]
      description: 'Requires print_jobs:write (fulfilment). No body. Reprints the latest misprinted job for free, increments attempt, and keeps the order printing. id is the store job ID, not the partner reference.'
      parameters: [ { name: id, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 100 } } ]
      responses:
        '201': { description: Free reprint accepted, content: { application/json: { schema: { $ref: '#/components/schemas/PrintJob' } } } }
        '401': { description: Missing or invalid API key }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
        '503': { description: PrintHub unavailable; safe to retry, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /shipments:
    get:
      tags: [fulfilment]
      description: 'Requires shipments:read (fulfilment, support, hq, founder). Latest 200 bookings, newest first.'
      parameters: [ { name: status, in: query, schema: { $ref: '#/components/schemas/ShipmentStatus' } } ]
      responses:
        '200': { description: Shipments with orderNumber, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Shipment' } } } } }
        '401': { description: Missing or invalid API key }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
    post:
      tags: [fulfilment]
      description: 'Requires shipments:write (fulfilment). Latest print job must be handed_over; order must be printing with no prior shipment. Acceptance moves order to shipped. Courier prices are 5000/6500/8500 paise for same_city/same_zone/national.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [orderNumber]
              properties:
                orderNumber: { type: string, pattern: '^ORD-[0-9]{1,12}$' }
      responses:
        '201': { description: Booked with ShipFast, content: { application/json: { schema: { $ref: '#/components/schemas/Shipment' } } } }
        '401': { description: Missing or invalid API key }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
        '503': { description: ShipFast unavailable or unexpected response; safe to retry, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /shipments/{id}/reship:
    post:
      tags: [fulfilment]
      description: >
        Requires reship:write (fulfilment). No body. Only the latest returned_to_origin or
        lost shipment can be replaced. The first reship per order is allowed; subsequent
        reships require founder approval (limits from Setting). Delivery retries are not
        reships. Repeated pending requests reuse one approvalId and book nothing until
        approved. The executor rechecks the source and books once on approval. Each booking
        has its own outbound cost; RTO doubles the cost of that booking only.
      parameters: [ { name: id, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 100 } } ]
      responses:
        '201': { description: Reship booked, content: { application/json: { schema: { $ref: '#/components/schemas/Shipment' } } } }
        '202': { $ref: '#/components/responses/PendingApproval' }
        '401': { description: Missing or invalid API key }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
        '503': { description: ShipFast unavailable; safe to retry, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ---------- finance ----------
  /refunds:
    get:
      tags: [finance]
      responses: { '200': { description: Refunds } }
    post:
      tags: [finance]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [orderNumber, amountPaise, reason], properties: { orderNumber: { type: string }, amountPaise: { type: integer, minimum: 1 }, reason: { type: string }, ticketNumber: { type: string } } } } }
      responses:
        '201': { description: Refund processed with credit note }
        '202': { $ref: '#/components/responses/PendingApproval' }
        '409': { $ref: '#/components/responses/Conflict' }
  /refund-requests:
    post:
      tags: [support]
      summary: Support asks Finance for a refund (does not move money)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [orderNumber, amountPaise, reason], properties: { orderNumber: { type: string }, amountPaise: { type: integer }, reason: { type: string }, ticketNumber: { type: string } } } } } }
      responses: { '201': { description: Request raised (event refund.requested) } }
  /invoices/{number}:
    get:
      tags: [finance, public]
      parameters: [ { name: number, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: GST tax invoice (JSON; add Accept text/html for printable view) } }
  /partner-invoices:
    get:
      tags: [finance]
      parameters: [ { name: status, in: query, schema: { type: string } } ]
      responses: { '200': { description: Partner invoices } }
  /partner-invoices/{id}/verify:
    post:
      tags: [finance]
      summary: Compare invoice lines to the app's records; returns mismatches
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: Verification result with mismatched lines } }
  /partner-invoices/{id}/pay:
    post:
      tags: [finance]
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: Paid; ledger updated }
        '202': { $ref: '#/components/responses/PendingApproval' }
  /partner-invoices/{id}/dispute:
    post:
      tags: [finance]
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string } } } } } }
      responses: { '200': { description: Disputed } }
  /ledger:
    get:
      tags: [finance]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: account, in: query, schema: { type: string } }
      responses: { '200': { description: Ledger entries } }
  /reports/pnl:
    get:
      tags: [finance]
      parameters: [ { name: date, in: query, schema: { type: string, format: date } } ]
      responses: { '200': { description: Daily profit and loss } }
  /reports/gst:
    get:
      tags: [finance]
      parameters: [ { name: month, in: query, schema: { type: string, example: '2026-11' } } ]
      responses: { '200': { description: GST summary (GSTR-1/3B shaped) } }

  # ---------- marketing ----------
  /discount-codes:
    get: { tags: [marketing], responses: { '200': { description: Codes } } }
    post:
      tags: [marketing]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code, percent, endsAt], properties: { code: { type: string }, percent: { type: integer, minimum: 1, maximum: 50 }, startsAt: { type: string, format: date-time }, endsAt: { type: string, format: date-time } } } } } }
      responses:
        '201': { description: Created }
        '202': { $ref: '#/components/responses/PendingApproval' }
  /campaigns:
    get: { tags: [marketing], responses: { '200': { description: Campaigns with spend and results } } }
    post:
      tags: [marketing]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name, channel, budgetPaise], properties: { name: { type: string }, channel: { type: string, enum: [instagram, google, influencer] }, budgetPaise: { type: integer }, startsAt: { type: string }, endsAt: { type: string } } } } } }
      responses:
        '201': { description: Created }
        '202': { $ref: '#/components/responses/PendingApproval' }

  # ---------- support ----------
  /tickets/{number}:
    get:
      tags: [support]
      parameters: [ { name: number, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: Ticket, content: { application/json: { schema: { $ref: '#/components/schemas/Ticket' } } } } }
  /tickets/{number}/reply:
    post:
      tags: [support]
      parameters: [ { name: number, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [message], properties: { message: { type: string }, close: { type: boolean, default: false } } } } } }
      responses: { '200': { description: Reply sent to the in-app email outbox } }
  /returns:
    post:
      tags: [support]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [orderNumber, reason], properties: { orderNumber: { type: string }, reason: { type: string, enum: [size, defect, other] }, ticketNumber: { type: string } } } } } }
      responses: { '201': { description: Return pickup booked }, '409': { $ref: '#/components/responses/Conflict' } }

  # ---------- approvals ----------
  /approvals:
    get:
      tags: [approvals]
      summary: Approval requests, newest first (hq and founder keys)
      parameters: [ { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected, expired] } } ]
      responses:
        '200': { description: Approval requests, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Approval' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
  /approvals/{id}:
    get:
      tags: [approvals]
      summary: One approval by number (hq and founder keys)
      parameters: [ { name: id, in: path, required: true, schema: { type: string, example: APR-7 } } ]
      responses:
        '200': { description: Approval, content: { application/json: { schema: { $ref: '#/components/schemas/Approval' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /approvals/{id}/decision:
    post:
      tags: [approvals]
      summary: Founder key only
      description: >-
        Approve runs the stored action exactly once, in the same transaction as the decision, and
        writes approval.decided plus the action's own events. If the action fails, nothing is
        recorded and the request stays pending. Reject needs a reason and records it. 409 with
        already_decided when the request is no longer pending, or action_not_supported when the
        store has no way to run that action yet (it can still be rejected).
      parameters: [ { name: id, in: path, required: true, schema: { type: string, example: APR-7 } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [decision], properties: { decision: { type: string, enum: [approve, reject] }, reason: { type: string, minLength: 1, maxLength: 500, description: Required to reject } } } } } }
      responses:
        '200': { description: Decision recorded; action executed on approve, content: { application/json: { schema: { $ref: '#/components/schemas/Approval' } } } }
        '403': { description: Not the founder key, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }

  # ---------- platform ----------
  /events:
    get:
      tags: [platform]
      parameters:
        - { name: after, in: query, schema: { type: integer, default: 0, minimum: 0, maximum: 2147483647 } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 500 } }
      description: >
        Outbox events with seq greater than `after`, oldest first. Page by passing the last
        seq back as `after`. Events become visible in seq order (writers are serialised), so a
        poller never skips one. Needs the `events:read` scope (`hq` and `founder` keys).
      responses:
        '200': { description: Events in order, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Event' } } } } }
        '401': { description: Missing or invalid API key, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
  /flags:
    get: { tags: [platform], responses: { '200': { description: Feature flags } } }
  /flags/{key}:
    put:
      tags: [platform]
      parameters: [ { name: key, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [enabled], properties: { enabled: { type: boolean } } } } } }
      responses: { '200': { description: Updated } }
  /webhooks/{partner}:
    post:
      tags: [platform]
      security: []
      summary: Partner webhooks; verified by X-SG-Signature HMAC
      parameters:
        - { name: partner, in: path, required: true, schema: { type: string, enum: [paymock, printhub, shipfast] } }
        - { name: X-SG-Signature, in: header, required: true, schema: { type: string, example: 'sha256=3f1c…' }, description: 'sha256=<hex HMAC-SHA256 of the raw body> with the partner''s secret' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WebhookEnvelope' } } }
      responses:
        '200':
          description: >
            Accepted. A repeated eventId changes nothing and returns duplicate. PayMock sends
            payment.captured {gatewayRef, orderRef, orderNumber, amountPaise, feePaise, feeGstPaise, capturedAt},
            payment.failed {gatewayRef, orderRef, orderNumber, amountPaise, reason: declined|expired} and
            settlement.processed {settlementRef, settledAt, payments: [{gatewayRef, amountPaise, feePaise, feeGstPaise}]}
            (packages/shared/src/paymock.ts). All fields are required. orderRef is the store's internal
            order id, given to PayMock when the payment is opened and echoed back; order numbers restart
            after a demo reset, so the store accepts a payment only if both orderRef and orderNumber
            match the same order, and answers 409 unknown_order otherwise.
          content: { application/json: { schema: { type: object, properties: { eventId: { type: string }, status: { type: string, enum: [processed, ignored, duplicate] } } } } }
        '401': { description: Missing or bad signature, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            Refused for good, so the partner stops retrying; nothing is recorded. Errors:
            unknown_order, amount_mismatch, order_not_payable (e.g. cancelled as unpaid), payment_conflict, invalid_data.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422': { $ref: '#/components/responses/Invalid' }

components:
  securitySchemes:
    departmentKey:
      type: http
      scheme: bearer
      description: 'sg_<department>_<random>; scopes per docs/architecture.md'
  parameters:
    OrderNumber: { name: number, in: path, required: true, schema: { type: string, example: ORD-1042 } }
  responses:
    Forbidden: { description: The key's department lacks the scope for this endpoint, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Invalid: { description: Validation failed, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: Not allowed in the current state, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    PendingApproval:
      description: Over a limit; waiting for the founder
      content: { application/json: { schema: { type: object, properties: { approvalId: { type: string, example: APR-7 }, status: { const: pending } } } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties: { error: { type: string }, details: { type: object } }
    OrderStatus:
      type: string
      enum: [placed, paid, printing, shipped, delivered, cancelled, returned, refunded]
    PrintJobStatus:
      type: string
      enum: [received, in_production, quality_check, packed, handed_over, artwork_rejected, misprint, blank_out_of_stock]
    PrintJob:
      type: object
      required: [id, orderId, partnerRef, status, attempt, costPaise, acceptedAt, dueAt, lateReportedAt, createdAt, updatedAt]
      properties:
        id: { type: string }
        orderId: { type: string }
        orderNumber: { type: string, description: Included on list responses }
        partnerRef: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/PrintJobStatus' }
        attempt: { type: integer, minimum: 1 }
        costPaise: { type: integer, minimum: 0 }
        acceptedAt: { type: string, format: date-time, description: Business time }
        dueAt: { type: string, format: date-time, description: acceptedAt plus two business days }
        lateReportedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ShipmentStatus:
      type: string
      enum: [pickup_scheduled, picked_up, in_transit, out_for_delivery, delivered, delivery_failed, returned_to_origin, lost]
    ShippingZone:
      type: string
      enum: [same_city, same_zone, national]
    Shipment:
      type: object
      required: [id, orderId, awb, status, zone, attempts, sequence, reshipOfId, approvalId, costPaise, bookedAt, estimatedDeliveryAt, deliveredAt, createdAt, updatedAt]
      properties:
        id: { type: string }
        orderId: { type: string }
        orderNumber: { type: string, description: Included on list responses }
        awb: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/ShipmentStatus' }
        zone: { $ref: '#/components/schemas/ShippingZone' }
        attempts: { type: integer, minimum: 0, maximum: 3, description: Delivery attempts on this AWB }
        sequence: { type: integer, minimum: 1, description: 1 is the original booking; 2 is the first reship }
        reshipOfId: { type: [string, 'null'] }
        approvalId: { type: [string, 'null'], description: Internal approval record ID for gated bookings }
        costPaise: { type: integer, minimum: 0, description: Outbound rate; doubles on RTO }
        bookedAt: { type: string, format: date-time, description: Business time }
        estimatedDeliveryAt: { type: [string, 'null'], format: date-time }
        deliveredAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CustomerInput:
      type: object
      required: [name, email, phone, address, city, state, pincode]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        address: { type: string }
        city: { type: string }
        state: { type: string }
        pincode: { type: string, pattern: '^[1-9][0-9]{5}$' }
    Product:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
        collection: { type: string }
        description: { type: string }
        artworkUrl: { type: string }
        variants: { type: array, items: { type: object, properties: { sku: { type: string }, fit: { type: string }, colour: { type: string }, size: { type: string }, pricePaise: { type: integer } } } }
    Order:
      type: object
      properties:
        number: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        items: { type: array, items: { type: object, properties: { sku: { type: string }, qty: { type: integer }, unitPricePaise: { type: integer } } } }
        subtotalPaise: { type: integer }
        discountPaise: { type: integer }
        shippingPaise: { type: integer }
        taxPaise: { type: integer }
        totalPaise: { type: integer }
        timeline: { type: array, items: { type: object, properties: { status: { type: string }, at: { type: string } } } }
        printJob: { type: object }
        shipment: { type: object }
        invoiceNumber: { type: string }
    TrackedOrder:
      type: object
      required: [number, status, placedAt, timeline, awb, invoiceNumber]
      properties:
        number: { type: string }
        status: { type: string }
        placedAt: { type: string, format: date-time }
        timeline:
          type: array
          items: { type: object, required: [type, label, at], properties: { type: { type: string }, label: { type: string }, at: { type: string, format: date-time } } }
        awb: { type: [string, 'null'] }
        invoiceNumber: { type: [string, 'null'] }
    Ticket:
      type: object
      properties:
        number: { type: string }
        orderNumber: { type: string }
        type: { type: string }
        status: { type: string }
        messages: { type: array, items: { type: object, properties: { from: { type: string }, body: { type: string }, at: { type: string } } } }
    Approval:
      type: object
      properties:
        id: { type: string, example: APR-7 }
        department: { type: string }
        action: { type: string, example: refund.create }
        payload: { type: object }
        amountPaise: { type: [integer, 'null'] }
        reason: { type: string, description: Why the request needs the founder }
        status: { type: string, enum: [pending, approved, rejected, expired] }
        decidedBy: { type: [string, 'null'] }
        decidedAt: { type: [string, 'null'], format: date-time }
        decisionReason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    WebhookEnvelope:
      type: object
      required: [eventId, type, occurredAt, data]
      properties:
        eventId: { type: string, description: 'Unique per partner; repeats are ignored' }
        type: { type: string, example: payment.captured }
        occurredAt: { type: string, format: date-time }
        data: { type: object }
    Event:
      type: object
      properties:
        seq: { type: integer }
        type: { type: string, example: order.paid }
        entityType: { type: string }
        entityId: { type: string }
        payload: { type: object }
        createdAt: { type: string }
