# Local stack: store :3000, sim :4000, gatekeeper :4100 (health), Postgres :5432.
# Values default to the test-only ones in .env.example; a local .env overrides them.
x-common-env: &common-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-switchgear}:${POSTGRES_PASSWORD:-switchgear-test-only}@db:5432/${POSTGRES_DB:-switchgear}
  STORE_URL: http://store:3000
  SIM_URL: http://sim:4000
  ORDER_LINK_SECRET: ${ORDER_LINK_SECRET:-test-only-order-link-secret}
  PAYMOCK_WEBHOOK_SECRET: ${PAYMOCK_WEBHOOK_SECRET:-test_paymock_secret}
  PRINTHUB_WEBHOOK_SECRET: ${PRINTHUB_WEBHOOK_SECRET:-test_printhub_secret}
  SHIPFAST_WEBHOOK_SECRET: ${SHIPFAST_WEBHOOK_SECRET:-test_shipfast_secret}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-switchgear}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-switchgear-test-only}
      POSTGRES_DB: ${POSTGRES_DB:-switchgear}
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-switchgear} -d ${POSTGRES_DB:-switchgear}']
      interval: 2s
      timeout: 3s
      retries: 20

  store:
    build: { context: ., target: store }
    environment:
      <<: *common-env
      SIM_PUBLIC_URL: ${SIM_PUBLIC_URL:-http://localhost:4000}
    ports:
      - '3000:3000'
    depends_on:
      db: { condition: service_healthy }

  sim:
    build: { context: ., target: sim }
    environment:
      <<: *common-env
      SIM_PORT: '4000'
    ports:
      - '4000:4000'
    depends_on:
      - store

  gatekeeper:
    build: { context: ., target: gatekeeper }
    environment:
      <<: *common-env
      GATEKEEPER_PORT: '4100'
      GATEKEEPER_STATE_FILE: /app/data/state.json
      # Gatekeeper stays health-only until all four Switch values and the founder key are set.
      SG_KEY_FOUNDER: ${SG_KEY_FOUNDER:-}
      SWITCH_URL: ${SWITCH_URL:-}
      SWITCH_AGENT_ID: ${SWITCH_AGENT_ID:-}
      SWITCH_AGENT_TOKEN: ${SWITCH_AGENT_TOKEN:-}
      SWITCH_FOUNDER_ID: ${SWITCH_FOUNDER_ID:-}
      SWITCH_FOUNDER_NAME: ${SWITCH_FOUNDER_NAME:-}
    ports:
      - '4100:4100'
    volumes:
      - gatekeeper-state:/app/data
    depends_on:
      - store

volumes:
  db-data:
  gatekeeper-state:
